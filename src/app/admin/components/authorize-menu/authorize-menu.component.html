<div class="container">
  <div class="card">
    <div class="card-header">
      <span>Authorize Roles</span>
    </div>
    <div class="card-body">
      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
        <!-- This is the tree node template for leaf nodes -->
        <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
          <!-- use a disabled button to provide padding for tree leaf -->
          {{node.name}}
          <mat-icon>keyboard_arrow_right</mat-icon>
          <a (click)="assignRole(node.code, node.name, node.menuName)" style="color: rgb(255, 0, 72); margin-right: 10px;cursor: pointer;">Assign Role</a>
          <!-- <mat-icon style="margin-right: 4px;">perm_identity</mat-icon> -->

        </mat-tree-node>
        <!-- This is the tree node template for expandable nodes -->
        <mat-tree-node *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding>

          <mat-icon matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name" style="cursor: pointer; margin-right: 4px;">list</mat-icon>

          {{node.name}}
        </mat-tree-node>
      </mat-tree>
    </div>
  </div>
</div>
