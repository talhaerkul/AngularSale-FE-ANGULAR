<head>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  " />
</head>

<table mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let element">
      <a href="/products/details/{{ element.id }}">{{ element.name }}</a>
    </td>
  </ng-container>

  <ng-container matColumnDef="brand">
    <th mat-header-cell *matHeaderCellDef>Brand</th>
    <td mat-cell *matCellDef="let element">
      <a href="/products/brands/{{ element.brand }}">{{ element.brand }}</a>
    </td>
  </ng-container>

  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef>Price</th>
    <td mat-cell *matCellDef="let element">
      {{ element.price | currency : "$" }}
    </td>
  </ng-container>

  <ng-container matColumnDef="stock">
    <th mat-header-cell *matHeaderCellDef>Stock</th>
    <td mat-cell *matCellDef="let element">{{ element.stock }}</td>
  </ng-container>

  <ng-container matColumnDef="createdDate">
    <th mat-header-cell *matHeaderCellDef>Created Date</th>
    <td mat-cell *matCellDef="let element">
      {{ element.createdDate | date : "MM/dd/yyyy - hh:mm a" }}
    </td>
  </ng-container>

  <ng-container matColumnDef="updatedDate">
    <th mat-header-cell *matHeaderCellDef>Updated Date</th>
    <td mat-cell *matCellDef="let element">
      {{ element.updatedDate | date : "MM/dd/yyyy - hh:mm a" }}
    </td>
  </ng-container>

  <ng-container matColumnDef="qrCode">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element">
      <img
        style="cursor: pointer"
        (click)="getProductQrCode(element.id)"
        src="../../../../../assets/img/qrcode-icon.png"
        width="25"
        height="25"
      />
    </td>
  </ng-container>

  <ng-container matColumnDef="image">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element">
      <img
        style="cursor: pointer"
        (click)="addProductImages(element.id)"
        src="../../../../../assets/img/image.png"
        width="25"
        height="25"
      />
    </td>
  </ng-container>

  <ng-container matColumnDef="edit">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element">
      <img
        style="cursor: pointer"
        src="../../../../../assets/img/edit.jpg"
        (click)="updateProduct(element.id)"
        width="25"
        height="25"
      />
    </td>
  </ng-container>

  <ng-container matColumnDef="delete">
    <th mat-header-cell *matHeaderCellDef></th>
    <td
      mat-cell
      *matCellDef="let element"
      appDelete
      [id]="element.id"
      controller="products"
      (refresh)="getProducts()"
    ></td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator
  (page)="pageChanged()"
  [pageSizeOptions]="[13, 30, 150]"
  showFirstLastButtons
  aria-label="Select page of periodic elements"
>
</mat-paginator>
