<mat-form-field class="product-create">
  <mat-label>Name</mat-label>
  <input matInput #txtName>
</mat-form-field>

<mat-form-field class="product-create">
  <mat-label>Brand</mat-label>
  <input matInput #txtBrand>
</mat-form-field>

<mat-form-field class="product-create">
  <mat-label>Description</mat-label>
  <input matInput #txtDescription>
</mat-form-field>

<mat-form-field class="product-create">
  <mat-label>Price</mat-label>
  <input matInput type="number" min="0" value="0" #txtPrice>
</mat-form-field>

<mat-form-field class="product-create">
  <mat-label>Stock</mat-label>
  <input matInput type="number" min="0" value="0" #txtStock>
</mat-form-field>

<button mat-raised-button color="primary" class="create-btn" (click)="create(txtName,txtBrand,txtDescription,txtPrice,txtStock)">Create Product</button>


<button mat-raised-button class="create-btn" (click)="updateProductQrCode()">Stock QRCode</button>

<mat-form-field class="category-create">
  <mat-label>Name</mat-label>
  <input matInput #txtCName>
</mat-form-field>

<button mat-raised-button color="primary" class="create-btn" (click)="createCategory(txtCName)">Create Category</button>
