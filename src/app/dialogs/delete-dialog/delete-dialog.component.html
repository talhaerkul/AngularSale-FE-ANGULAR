<h1 mat-dialog-title style="color: red;">Data will be deleted. Are you sure?</h1>
<div mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="data" cdkFocusInitial style="color: rgb(233, 46, 5); margin-left: 60px;">Yes</button>
  <button mat-button (click)="close()">Cancel</button>
</div>
