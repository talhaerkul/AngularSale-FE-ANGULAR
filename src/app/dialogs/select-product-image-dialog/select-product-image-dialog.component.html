<h2 mat-dialog-title>Product Images</h2>
<mat-dialog-content class="mat-typography">
  <app-file-upload [options]="options"></app-file-upload>

  <mat-card class="product-image-card" *ngFor="let image of images">
    <mat-card-header>
      <div class="form-check form-check-inline">
        <input (click)="showcase(image.id)" class="form-check-input" type="radio" name="ShowcaseOptions"/>
        <label class="form-check-label" for="ShowcaseOptions">Showcase</label>
      </div>
    </mat-card-header>
    <img mat-card-image style="width: 200px; height: 200px;" [src]="image.path">
    <mat-card-content>

    </mat-card-content>
    <mat-card-actions>
      <button mat-button (click)="deleteImage(image.id, $event)"
        style="background-color: brown; color: white; margin-left: 37%;">Delete</button>
    </mat-card-actions>
  </mat-card>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
</mat-dialog-actions>
